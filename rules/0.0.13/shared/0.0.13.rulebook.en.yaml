      "body": {
        "wolf": [
          "Most of you are good, the village. A few are evil: the pack of wolves, led by the Alpha. The pack knows each other. Good doesn't.",
          "Good wins the moment the Alpha dies. Early in the game the pack may name a new Alpha instead.",
          "The pack wins the moment it matches the number of everyone else alive (parity).",
          "On the final day comes the final vote: catch the Alpha and good wins; miss, and the pack wins.",
          "From 15 players the Cult Leader plays too, a third party that doesn't know the wolves. It recruits players; if the wolves win while it lives, the cult wins too. Parity counts the wolves plus the cult."
        ],
        "demon": [
          "Most of you are good, the village. A few are evil: the Fiend's court, the Fiend and its minions. Evil players know each other. Good doesn't.",
          "Good wins the moment the Fiend dies, unless the Understudy takes over.",
          "Evil wins the moment it matches the number of everyone else alive (parity).",
          "On the final day comes the final vote: catch the Fiend and good wins; miss, and evil wins.",
          "Minions are drawn at random, so nobody knows which are in play."
        ],
        "brood": [
          "1. Two sides: the humans and the hive. The hive's leader is the Queen; the hive knows each other, the humans don't. Kill the Queen and the humans win. The hive wins when it equals the living humans, or if the final day's vote misses the Queen.",
          "2. Nights: the {device} comes to you. Read your screen and tap. Everyone's turn takes the same time, whatever their role, and keep your screen to yourself. The game lasts 4 nights at 9 to 11 players, 5 from 12, then the final day.",
          "3. No night ability? You vote for a suspect. Only the most-named player is checked: if you named them, at your next turn you learn whether they went out (used a night ability) or stayed in.",
          "4. Each night the Queen plants a Parasite on someone, and the hive spreads a fever to someone else. So at least two people fall sick at once.",
          "5. Dawn: \"Kit and Jo are sick.\" One may carry a Burster; the others only have a fever. The sick still talk, vote and use their abilities.",
          "6. The next dawn, a Burster bursts: the host dies and becomes a Crawler, the hive's hunter. A fever breaks. The Medic can treat the sick, and the Doctor can tell a real Burster from a fever.",
          "7. Once anything has burst, the Crawlers kill someone every night.",
          "8. Days: talk, nominate, vote. {bar, select, mostVotes{An execution needs the most votes.} overHalf{An execution needs more than half of the living.} other{An execution needs half of the living.}} Executing a sick player stops a burst, but they might only have had a fever, or be the hive faking it.",
          "9. The dead keep talking{ghostVotes, plural, =0{, but have no ghost votes} one{ and keep one ghost vote} other{ and keep # ghost votes}}. Crawlers don't vote: they hunt.",
          "10. Your card tells you your ability. Tap \"What does my role do?\" any time."
        ],
        "possession": [
          "1. Two sides: the village and the cult. One of you is possessed and doesn't know it. The cultists know each other and their Cult Leader, and they steer the spirit.",
          "2. Nights: the {device} comes to you. Everyone picks another player every night, with their role's ability; nobody can skip. Keep your screen to yourself. From 7 players, when everyone has picked, all eyes close, and some roles are called by name to open their eyes and read their result: the dawn call.",
          "3. Whoever the possessed player picks dies at dawn, unless someone else protected them. {nightOne}",
          "4. On night 1 the {device} hides the spirit in a random good player; nobody knows where. Each dawn it moves where the Cult Leader steered it, unless that player was warded or died that night. It never enters the cult.",
          "5. Each night the Exorcist, and from 9 players the Chaplain, picks a player for a Rite. A Rite on the possessed player strikes the spirit: dawn says \"The spirit was struck.\" but never whose Rite. The second strike casts it out, and the village wins.",
          "6. The spirit grows every night, and after night {nights}, it is at full strength. The next day is the final day, and it ends on a final vote: catch the Cult Leader, who called the spirit, and the village wins; miss, and the spirit takes the village: the cult wins.",
          "The village also wins if the Cult Leader dies, on any day or night: executed, or picked by the possessed player. Early on, the next cultist in line takes over instead. The cult also wins at once if it matches everyone else alive.",
          "7. Never execute the possessed: they're one of you, and the spirit just flees into a neighbour. Strike it with a Rite instead.",
          "8. Villagers learn at their next turn how many other players also picked the same player (no count after the final night). Say who you picked: a count that nobody claims is a hidden pick.",
          "9. The dead keep talking, {ghostVotes, plural, =0{have no ghost votes} one{keep one ghost vote for the whole game} other{keep # ghost votes for the whole game}}, and keep picking each night, but only for a count: at their next turn they learn how many living players picked the same player. A dead player's pick never kills, never uses their old ability, and is never counted.",
          "10. Days: talk, nominate, then hands up for each nominee. The player with the most votes is executed{bar, select, mostVotes{ (ghost votes count)} overHalf{, if they have more votes than half the number of living players (ghost votes count)} other{, if they have at least as many votes as half the number of living players (ghost votes count)}}. {ties, select, revote{A tie gets one revote between the tied; still tied, nobody is executed.} other{A tie executes nobody.}}"
        ]
      }
