          "text": "Your answer to \"Who do you suspect? It changes nothing.\" is private and feeds nothing public; it's there so nobody can tell who has an ability."
        },
        {
          "modes": [
            "possession"
          ],
          "text": "If the spirit is in you, the player you pick dies (from night 2; from night 1 at 13+ players). Nobody tells you."
