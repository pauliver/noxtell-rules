      "id": "rounds",
      "tab": "basics",
      "title": "Nights and days",
      "body": {
        "wolf": [
          "The {device} is the storyteller. There are two teams: most of you are good, a few are evil. Evil players start out knowing each other; good players don't.",
          "At night the {device} calls each role in turn, or is passed round the table, and players use their abilities in secret.",
          "Which roles the {device} calls never depends on who was dealt what, so a call proves nothing.",
          "At dawn the {device} says who died. Roles aren't revealed on death.",
          "By day everyone talks: share what you know, or what you want the others to believe."
        ],
        "demon": [
          "The {device} is the storyteller. There are two teams: most of you are good, a few are evil. Evil players start out knowing each other; good players don't.",
