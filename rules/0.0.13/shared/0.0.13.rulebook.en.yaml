    {
      "id": "votes",
      "tab": "basics",
      "title": "Nominations and votes",
      "body": [
        "After the talk, players nominate. The {device} then goes through the nominees, and you vote by raising hands. Nobody votes for themselves.",
        "To be executed, a player needs more votes than anyone else{bar, select, mostVotes{} overHalf{, and more than half as many votes as there are living players} other{, and at least as many votes as half the number of living players}}. Ghost votes count. {ties, select, revote{A tie for the most gets one revote between the tied; still tied, nobody is executed.} other{A tie for the most executes nobody.}} At most one execution a day.",
        "On the final day there's a final vote: every living player{ghostVotes, plural, =0{} one{, and every dead player who still has their ghost vote,} other{, and every dead player who still has a ghost vote left,}} votes for one player, and the player with the most votes is executed. {finalRevotes, plural, =0{A tie: evil wins.} one{A tie gets one revote between the tied players; still tied, evil wins.} other{A tie gets up to # revotes between the tied players; still tied, evil wins.}}"
      ]
    },
    {
      "id": "ghosts",
      "tab": "basics",
      "title": "The dead",
      "body": {
        "possession": [
          "The dead keep talking. {ghostVotes, plural, =0{The dead have no ghost votes.} one{Each dead player has one ghost vote for the whole game: they can use it once, on any vote, the final vote included.} other{Each dead player has # ghost votes for the whole game: they can use one on any vote, the final vote included.}} The dead don't count at parity.",
          "There is no ghosts' hint in Possession. Instead, each night every dead player picks a living player, and at their next turn learns how many living players also picked that player (no count after the final night). A dead player's pick never kills and is never counted."
