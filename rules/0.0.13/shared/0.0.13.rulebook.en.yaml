          "On nights when roles are called there are no turns: from the first night a role can have changed, the {device} goes round once early in the night instead, and every living player gets a quick, private look at their card.",
          "In wolf mode a role changes when:",
          "• the pack names its Alpha: on night 1, and again if the Alpha dies early. The pack sees whom it named when it wakes, and the Wolf it names reads \"You lead the pack.\" whenever it next looks at its card.",
          "• the Meddler swaps two good players' roles, once a game. The swap happens at dawn, so you may play a whole day as your new role before your next turn tells you.",
          "• the Mad Hatter is shown a different good role every night. From night 2 it also maddens a good neighbour, who is shown a false role for a night and a day, then their own role again.",
          "Every card in this mode says your role can change. A card whose role has just changed also shows ⇄ beside its headline; no other card has a mark. Keep your card to yourself."
        ],
        "demon": [
          "Your role can change during the game. When it does, your next night turn tells you \"Your role changed.\", what you were and what you are now. It never says why, and it can happen more than once.",
