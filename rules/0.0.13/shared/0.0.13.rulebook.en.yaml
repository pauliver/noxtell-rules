        "other": [
          "The dead keep talking. {ghostVotes, plural, =0{The dead have no ghost votes.} one{Each dead player has one ghost vote for the whole game: they can use it once, on any vote, the final vote included.} other{Each dead player has # ghost votes for the whole game: they can use one on any vote, the final vote included.}} The dead don't count at parity.",
          "Each night the dead may name a suspect. If two or more ghosts name the same player, dawn announces the ghosts' hint. It's only the dead's opinion."
        ]
